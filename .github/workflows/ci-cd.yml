name: ReceiptAI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

env:
  NODE_VERSION: '18'
  DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
  TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
  N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd receipt-parser-web
          npm ci

      - name: Run ESLint
        run: |
          cd receipt-parser-web
          npm run lint

      - name: Run TypeScript type check
        run: |
          cd receipt-parser-web
          npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_receiptai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd receipt-parser-web
          npm ci

      - name: Setup test database
        run: |
          cd receipt-parser-web
          psql -h localhost -U postgres -d test_receiptai -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          node tests/setup-test-db.js

      - name: Run unit tests
        run: |
          cd receipt-parser-web
          npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./receipt-parser-web/tests/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_receiptai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd receipt-parser-web
          npm ci

      - name: Setup test database
        run: |
          cd receipt-parser-web
          psql -h localhost -U postgres -d test_receiptai -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          node tests/setup-test-db.js

      - name: Run API tests
        run: |
          cd receipt-parser-web
          npm run test:api

      - name: Upload API test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: api-test-results
          path: receipt-parser-web/tests/api/test-results.xml

  ocr-tests:
    name: OCR Processing Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_receiptai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd receipt-parser-web
          npm ci

      - name: Setup test database
        run: |
          cd receipt-parser-web
          psql -h localhost -U postgres -d test_receiptai -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          node tests/setup-test-db.js

      - name: Run OCR tests
        run: |
          cd receipt-parser-web
          npm run test:ocr

      - name: Upload OCR test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ocr-test-results
          path: receipt-parser-web/tests/ocr/test-results.xml

  bot-tests:
    name: Telegram Bot Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_receiptai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd receipt-parser-web
          npm ci

      - name: Setup test database
        run: |
          cd receipt-parser-web
          psql -h localhost -U postgres -d test_receiptai -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          node tests/setup-test-db.js

      - name: Run Bot tests
        run: |
          cd receipt-parser-web
          npm run test:bot

      - name: Upload Bot test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bot-test-results
          path: receipt-parser-web/tests/bot/test-results.xml

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_receiptai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd receipt-parser-web
          npm ci

      - name: Install Playwright browsers
        run: |
          cd receipt-parser-web
          npx playwright install --with-deps

      - name: Setup test database
        run: |
          cd receipt-parser-web
          psql -h localhost -U postgres -d test_receiptai -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          node tests/setup-test-db.js

      - name: Build application
        run: |
          cd receipt-parser-web
          npm run build

      - name: Run E2E tests
        run: |
          cd receipt-parser-web
          npm run test:e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-results
          path: |
            receipt-parser-web/tests/e2e-results/
            receipt-parser-web/playwright-report/

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_receiptai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd receipt-parser-web
          npm ci

      - name: Setup test database
        run: |
          cd receipt-parser-web
          psql -h localhost -U postgres -d test_receiptai -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          node tests/setup-test-db.js

      - name: Build application
        run: |
          cd receipt-parser-web
          npm run build

      - name: Run performance tests
        run: |
          cd receipt-parser-web
          npm run test:performance

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-results
          path: receipt-parser-web/tests/performance/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd receipt-parser-web
          npm ci

      - name: Run security audit
        run: |
          cd receipt-parser-web
          npm audit --audit-level moderate

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          languages: javascript

  generate-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, ocr-tests, bot-tests, e2e-tests, performance-tests]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd receipt-parser-web
          npm ci

      - name: Download all test artifacts
        uses: actions/download-artifact@v3

      - name: Generate comprehensive test report
        run: |
          cd receipt-parser-web
          node tests/scripts/generate-report.js

      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: receipt-parser-web/tests/reports/

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = './receipt-parser-web/tests/reports/test-results.json';
            
            if (fs.existsSync(path)) {
              const results = JSON.parse(fs.readFileSync(path, 'utf8'));
              const summary = results.summary;
              
              const comment = `
              ## 🧪 Test Results Summary
              
              **Overall Results:**
              - Total Tests: ${summary.totalTests}
              - ✅ Passed: ${summary.passedTests}
              - ❌ Failed: ${summary.failedTests}
              - ⏭️ Skipped: ${summary.skippedTests}
              - 📊 Coverage: ${summary.coverage.lines.toFixed(1)}%
              
              **Results by Category:**
              ${Object.entries(results.categories).map(([cat, stats]) => 
                `- ${cat.toUpperCase()}: ${stats.passed}/${stats.total} (${((stats.passed/stats.total)*100).toFixed(1)}%)`
              ).join('\n')}
              
              **Key Insights:**
              ${results.insights.slice(0, 3).map(insight => 
                `- ${insight.severity === 'high' ? '🔴' : insight.severity === 'medium' ? '🟡' : '🟢'} ${insight.title}`
              ).join('\n')}
              
              📊 [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: github.ref == 'refs/heads/develop' && success()
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # Example: docker build and push to staging registry

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging..."
          # Add smoke test commands here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: github.ref == 'refs/heads/main' && success()
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your deployment commands here
          # Example: docker build and push to production registry

      - name: Run health checks
        run: |
          echo "Running health checks on production..."
          # Add health check commands here

  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: always()

    steps:
      - name: Notify Slack on success
        if: success()
        run: |
          echo "Notifying Slack of successful pipeline..."
          # Add Slack notification here

      - name: Notify Slack on failure
        if: failure()
        run: |
          echo "Notifying Slack of pipeline failure..."
          # Add Slack notification here

      - name: Notify Discord
        run: |
          echo "Notifying Discord..."
          # Add Discord notification here