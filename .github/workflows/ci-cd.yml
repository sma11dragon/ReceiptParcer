name: ReceiptAI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

env:
  NODE_VERSION: '18'
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
  N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: receipt-parser-web/package-lock.json

      - name: Install dependencies
        run: |
          cd receipt-parser-web
          npm ci

      - name: Run ESLint
        run: |
          cd receipt-parser-web
          npm run lint

      - name: Run TypeScript type check
        run: |
          cd receipt-parser-web
          npx tsc --noEmit

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: receipt-parser-web/package-lock.json

      - name: Install dependencies
        run: |
          cd receipt-parser-web
          npm ci

      - name: Run security audit
        continue-on-error: true
        run: |
          cd receipt-parser-web
          npm audit --audit-level critical

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, security-scan]
    if: github.ref == 'refs/heads/develop' && success()
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging..."
          # Add smoke test commands here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, security-scan]
    if: github.ref == 'refs/heads/main' && success()
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your deployment commands here

      - name: Run health checks
        run: |
          echo "Running health checks on production..."
          # Add health check commands here

  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, security-scan]
    if: always()

    steps:
      - name: Notify Slack on success
        if: success()
        run: |
          echo "Notifying Slack of successful pipeline..."
          # Add Slack notification here

      - name: Notify Slack on failure
        if: failure()
        run: |
          echo "Notifying Slack of pipeline failure..."
          # Add Slack notification here

      - name: Notify Discord
        run: |
          echo "Notifying Discord..."
          # Add Discord notification here
